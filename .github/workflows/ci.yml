name: CI

# The split repository now runs its test suite automatically. Live third-party-network
# tests are deselected below; all other collected tests run under both supported versions.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: pytest · py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint package and tests; compile all Python sources
        # Historical campaign scripts retain separately recorded style debt. Compile them
        # too so reporting-only syntax cannot silently exceed the supported Python floor.
        run: |
          python -m ruff check src tests
          python -m compileall -q src tests scripts

      - name: Run tests
        # Deselect the network-marked tests: they make live TAP calls to ESO and the NASA
        # Exoplanet Archive, so leaving them in makes CI fail when a third party is down
        # rather than when this code breaks. The slow-marked orbit fits are kept.
        run: pytest -q -m "not network"
