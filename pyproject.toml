[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exosat-rv"
version = "0.1.0"
description = "Audit a conditional, paper-calibrated recovery of the reported CD-35 2722 B radial-velocity signal from public ESO data and study comparable companion time series."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matthew Potts", email = "matthew.e.potts@gmail.com" }]
keywords = ["astronomy", "exomoon", "exosatellite", "radial-velocity", "brown-dwarf", "CRIRES", "direct-imaging"]

# The installed package covers the archive and reusable analysis layers. The historical
# raw-to-RV drivers also require the external cr2res and VIPER projects; those are not PyPI
# dependencies and are documented in docs/viper-runbook.md. Versions here are floors, not a
# reconstruction of the uncaptured historical run environment.
dependencies = [
    "typer>=0.12",
    "pyvo>=1.5",              # ESO tap_obs (dbo.raw + ivoa.ObsCore) and NASA Exoplanet Archive TAP
    "astropy>=6.0",           # Time (MJD<->ISO), SkyCoord cross-match, FITS spectra
    "scipy>=1.11",            # Keplerian model comparison (M6), GLS false-alarm levels (M4)
    "numpy>=1.26",
    "requests>=2.31",         # ESO datalink / product retrieval
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "pypdf>=4.0"]  # pypdf reads the preprint; see M1-RESULTS
# Script-only figure and nested-sampling analyses (M14/M18). Kept optional so the archive
# inventory package does not install a plotting/sampling stack by default.
science = ["dynesty>=2.1,<4", "matplotlib>=3.8"]
# M35's photometric cross-check re-fetches ASAS-SN light curves with the survey's own
# client. Optional on purpose: the fetched curve is committed as data/m35-asassn-cd35.csv,
# so the period search reruns from cache and only --refetch needs this.
photometry = ["skypatrol>=0.6"]

[project.scripts]
exosat-rv = "exosat_rv.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/exosat_rv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: performs a live TAP/HTTP request to ESO or the NASA Exoplanet Archive",
    "slow: needs downloaded spectra in data/spectra, or runs many optimiser restarts",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"src/exosat_rv/cli.py" = ["B008"]  # typer's API is `x: T = typer.Option(...)` in the signature
